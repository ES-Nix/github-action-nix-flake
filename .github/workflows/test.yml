name: "Test"
on:
  pull_request:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect /dev/kvm
        run: |
          id
          stat /dev/kvm
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          source-tag: v0.38.1
          source-revision: 107d5ef05c0b1119749e381451389eded30fb0d5
          diagnostic-endpoint: ""
          nix-package-url: https://releases.nixos.org/nix/nix-2.26.2/nix-2.26.2-x86_64-linux.tar.xz
 
      - name: Build
        run: |
          id
          stat /dev/kvm
          nix registry list 
          nix registry pin nixpkgs github:NixOS/nixpkgs/30c9efeef01e2ad4880bff6a01a61dd99536b3c9
          nix run nixpkgs#nix-info -- --markdown
          nix flake metadata nixpkgs
          nix build --no-link --print-build-logs --print-out-paths nixpkgs#pkgsStatic.hello

      - name: docker
        run: |
          # podman images || true
          docker images || true
          docker run alpine:3.18 sh -c 'cat /etc/os-release'

      - name: nix build ...
        run: |
          nix build --cores 3 --no-link --print-build-logs --print-out-paths \
          github:NixOS/nixpkgs/30c9efeef01e2ad4880bff6a01a61dd99536b3c9#pkgsCross.riscv64.python3Packages.uv
