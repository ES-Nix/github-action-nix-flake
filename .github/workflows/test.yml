name: "Test matrix of OSes and Nix versions"
on:
  pull_request:
  push:
jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # - ubuntu-24.04
          # - ubuntu-22.04
          # - ubuntu-20.04
          - macos-latest
          # - macos-15
          # - macos-14
          - macos-13

    steps:
      - name: Inspect /dev/kvm before everything
        run: |
          id
          stat /dev/kvm || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
        with:
          source-tag: v0.38.1
          diagnostic-endpoint: ""
 
      - name: Build pkgsStatic.hello for testing nix
        run: |
          nix flake --version
          # nix registry list
          nix registry pin nixpkgs github:NixOS/nixpkgs/1546c45c538633ae40b93e2d14e0bb6fd8f13347
          nix run nixpkgs#nix-info -- --markdown
          nix flake metadata nixpkgs
          nix build --no-link --print-out-paths nixpkgs#pkgsStatic.uv
      
      - name: Build checkedout flake
        run: |
          nix flake --version
          nix flake metadata '.#'
          nix flake show '.#'
          # nix flake check '.#'

